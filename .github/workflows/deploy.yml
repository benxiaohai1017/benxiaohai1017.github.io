name: Build and Deploy Hugo Site

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.170.1'
          extended: true

      - name: Setup Dart Sass
        run: |
          curl -fsSL --retry 3 -o /tmp/sass.tar.gz \
            https://github.com/sass/dart-sass/releases/download/1.108.2/dart-sass-1.108.2-linux-x64.tar.gz
          mkdir -p "$HOME/dart-sass"
          tar xzf /tmp/sass.tar.gz -C "$HOME/dart-sass" --strip-components=1
          echo "$HOME/dart-sass" >> "$GITHUB_PATH"
          "$HOME/dart-sass/sass" --version

      - name: Build site
        run: hugo --gc --minify --cleanDestinationDir

      - name: Deploy to main branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: ./public
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: hugo build'
