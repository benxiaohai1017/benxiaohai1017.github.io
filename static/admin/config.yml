# Sveltia CMS 配置
# 文档：https://sveltiacms.app/en/docs
#
# 认证方式：GitHub Personal Access Token（登录页点 "Sign In with Token"）
# 不需要 OAuth App，也不需要公网回调地址。

backend:
  name: github
  repo: benxiaohai1017/benxiaohai1017.github.io
  branch: source          # source 是源码分支；main 是 Actions 的构建产物，不要指向 main

site_url: https://benxiaohai1017.github.io
display_url: https://benxiaohai1017.github.io
logo_url: https://benxiaohai1017.github.io/images/avatar.png

# 上传的图片存到 static/images/，正文里引用为 /images/文件名
media_folder: static/images
public_folder: /images

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    description: 保存即提交到 source 分支，约 1 分钟后自动构建上线
    folder: content/post
    extension: md
    format: frontmatter
    create: true
    delete: false
    slug: "{{fields.slug}}"
    preview_path: "post/{{fields.slug}}/"
    sortable_fields: [date, title]
    summary: "{{title}}  ·  {{date}}"
    fields:
      - name: title
        label: 标题
        widget: string
        hint: 中文标题，会显示在文章页和列表里

      - name: slug
        label: 网址别名（新建时必填）
        widget: string
        required: false
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', '只能用小写英文、数字和连字符，例如 stm32-modbus-rtu']
        hint: 决定文章网址 /post/这里填的内容/。已有文章留空即可，不要改，否则网址会变。

      - name: date
        label: 发布日期
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm:ss"
        format: "YYYY-MM-DDTHH:mm:ssZ"

      - name: categories
        label: 分类
        widget: list
        required: false
        default: []
        hint: 留空也行，写了才会出现在分类页

      - name: tags
        label: 标签
        widget: list
        required: false
        default: []

      - name: draft
        label: 草稿（不发布）
        widget: boolean
        default: false

      - name: body
        label: 正文
        widget: markdown
        hint: 支持 Markdown；图片可直接拖进来，会自动上传到 static/images/
