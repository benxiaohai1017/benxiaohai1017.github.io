<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>博客后台</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f5f5f7;
        z-index: 99999;
        text-align: center;
        padding: 24px;
      }
      #boot-title { font-size: 18px; font-weight: 600; letter-spacing: .5px; }
      #boot-sub { font-size: 13px; color: #86868b; max-width: 340px; line-height: 1.7; }
      .spinner {
        width: 26px; height: 26px;
        border: 2.5px solid #d2d2d7;
        border-top-color: #0071e3;
        border-radius: 50%;
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        body, #boot { background: #1c1c1e; color: #f5f5f7; }
        #boot-sub { color: #98989d; }
        .spinner { border-color: #3a3a3c; border-top-color: #0a84ff; }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="spinner"></div>
      <div id="boot-title">博客后台</div>
      <div id="boot-sub">正在加载界面，首次约需 10–30 秒，之后会走浏览器缓存。</div>
    </div>

    <script>
      (function () {
        var t = setTimeout(function () {
          var s = document.getElementById('boot-sub');
          if (s) s.textContent = '网络较慢，还在加载中，请再等等…';
        }, 12000);
        window.addEventListener('load', function () {
          clearTimeout(t);
          var b = document.getElementById('boot');
          if (b) b.remove();
        });
        window.addEventListener('error', function (e) {
          if (e && e.target && e.target.tagName === 'SCRIPT') {
            var s = document.getElementById('boot-sub');
            var sp = document.querySelector('.spinner');
            if (sp) sp.style.display = 'none';
            if (s) s.textContent = '界面脚本加载失败，请刷新重试；若持续失败可换用别的网络。';
          }
        }, true);
      })();
    </script>

    <script src="/admin/sveltia-cms.js" type="module"></script>
  </body>
</html>
