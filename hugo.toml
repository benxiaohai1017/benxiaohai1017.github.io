baseURL                = "https://benxiaohai1017.github.io/"
locale                 = "zh-cn"
defaultContentLanguage = "zh"
title                  = "嵌入式码农的博客"
theme                  = "hugo-theme-stack"

enableRobotsTXT = true
enableEmoji     = true
hasCJKLanguage  = true
summaryLength   = 70
rssLimit        = 20

[pagination]
  pagerSize = 10

[permalinks]
  post = "/post/:contentbasename/"
  page = "/:slug/"

[taxonomies]
  tag = "tags"

[module]
  [module.hugoVersion]
    extended = false
    min      = "0.157.0"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos   = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 4
    ordered    = true

[params]
  mainSections   = ["post"]
  rssFullContent = true
  favicon        = "/favicon.ico"

  [params.footer]
    since = 2026

  [params.dateFormat]
    published   = ":date_full"
    lastUpdated = ":date_full"

  [params.sidebar]
    compact = false
    avatar  = "img/avatar.png"

  [params.article]
    headingAnchor = false
    toc           = true
    readingTime   = true

    [params.article.list]
      showTags = true

    [params.article.license]
      enabled = false

  [params.widgets]
    homepage = [
      { type = "archives", params = { limit = 5 } },
      { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

  [params.colorScheme]
    toggle  = true
    default = "auto"

  [params.comments]
    enabled = false

  [params.cookies]
    enabled = false

[[menu.main]]
  identifier = "home"
  name       = "首页"
  url        = "/"
  weight     = 10
  params     = { icon = "home" }

[[menu.main]]
  identifier = "posts"
  name       = "博客"
  url        = "/post/"
  weight     = 20
  params     = { icon = "hash" }

[[menu.main]]
  identifier = "archives"
  name       = "归档"
  url        = "/archives/"
  weight     = 30
  params     = { icon = "archives" }

[[menu.main]]
  identifier = "tags"
  name       = "标签"
  url        = "/tags/"
  weight     = 40
  params     = { icon = "tag" }

[[menu.main]]
  identifier = "about"
  name       = "关于"
  url        = "/about/"
  weight     = 50
  params     = { icon = "user" }

[[menu.social]]
  identifier = "github"
  name       = "GitHub"
  url        = "https://github.com/benxiaohai1017"
  params     = { icon = "brand-github" }

[[menu.social]]
  identifier = "mail"
  name       = "Mail"
  url        = "mailto:1032181400@qq.com"
  params     = { icon = "messages" }
